# Qonductor Operator Deployment
# Runs the HybridWorkflowController and QuantumSchedulerController
# as a single pod (leader-elected for HA via Raft).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: qonductor-operator
  namespace: default
  labels:
    app: qonductor
    component: operator
spec:
  replicas: 1  # Leader election via Raft (§4.1 fault tolerance)
  selector:
    matchLabels:
      app: qonductor
      component: operator
  template:
    metadata:
      labels:
        app: qonductor
        component: operator
    spec:
      serviceAccountName: qonductor-operator
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      containers:
        - name: operator
          image: qonductor-operator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9100
              protocol: TCP
          command:
            - python
            - -m
            - src.operator.controller
          env:
            - name: QONDUCTOR_MODE
              value: "k8s"
            - name: QONDUCTOR_CONFIG
              value: "/etc/qonductor/config.yaml"
            - name: PYTHONPATH
              value: "."
            - name: QONDUCTOR_REGISTRY_ROOT
              value: "/data/workflow_registry"
            - name: QONDUCTOR_LOG_LEVEL
              value: "INFO"
            - name: QONDUCTOR_SCHEDULING_INTERVAL
              value: "__SCHEDULING_INTERVAL__"
            - name: QONDUCTOR_SCHEDULING_THRESHOLD
              value: "__SCHEDULING_THRESHOLD__"
            - name: QONDUCTOR_TRANSPILATION_WORKERS
              value: "__TRANSPILATION_WORKERS__"
            - name: QONDUCTOR_TRANSPILATION_CACHE_ENABLED
              value: "__TRANSPILATION_CACHE_ENABLED__"
            - name: QONDUCTOR_TRANSPILATION_CACHE_SIZE
              value: "__TRANSPILATION_CACHE_SIZE__"
            - name: QISKIT_PARALLEL
              value: "False"
          resources:
            requests:
              cpu: "__OPERATOR_CPU_REQUEST__"
              memory: "__OPERATOR_MEMORY_REQUEST__"
            limits:
              cpu: "__OPERATOR_CPU_LIMIT__"
              memory: "__OPERATOR_MEMORY_LIMIT__"
          volumeMounts:
            - name: config
              mountPath: /etc/qonductor
              readOnly: true
            - name: data
              mountPath: /data
            - name: data
              mountPath: /app/data
      volumes:
        - name: config
          configMap:
            name: qonductor-config
        - name: data
          hostPath:
            # Rendered by docker/multi-host/deploy-cluster.sh.
            path: __QONDUCTOR_DATA_PATH__
            type: DirectoryOrCreate
