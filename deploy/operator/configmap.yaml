# Qonductor Operator configuration.
# Mirrors the paper's scheduling parameters (§7).

apiVersion: v1
kind: ConfigMap
metadata:
  name: qonductor-config
  namespace: default
  labels:
    app: qonductor
data:
  config.yaml: |
    # Quantum scheduler settings (paper section 7)
    scheduling-interval: __SCHEDULING_INTERVAL__
    scheduling-threshold: __SCHEDULING_THRESHOLD__

    # MCDM preference weights: fidelity, jct, or balanced.
    default-priority: balanced

    # Transpilation settings
    transpilation-level: pre-transpiled
    transpilation-count: 10
    transpilation-workers: __TRANSPILATION_WORKERS__
    transpilation-cache-enabled: __TRANSPILATION_CACHE_ENABLED__
    transpilation-cache-size: __TRANSPILATION_CACHE_SIZE__

    # Resource Estimator settings (paper section 6)
    resource-plans-count: 3

    # Fault tolerance (paper section 4.1)
    replicas: 3
    raft-heartbeat-delta: 2s

    # Workflow Registry root
    registry-root: /data/workflow_registry
